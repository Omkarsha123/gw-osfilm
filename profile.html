<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Frameflow Studio</title>
    <meta name="description" content="View your account and update your password." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vendors.css" />
    <link rel="stylesheet" href="mobile-menu.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="projects.html"><span class="brand-mark">F</span><span>frameflow<span class="brand-dot">.</span></span></a>
        <div class="workspace-label">WORKSPACE <span aria-hidden="true">⌄</span></div>
        <div class="workspace-card"><span class="workspace-avatar">MS</span><div><strong id="workspaceStudioName">Moonstone Studio</strong><small id="workspaceLabelText">Production desk</small></div></div>
        <nav class="side-nav" aria-label="Main navigation"><a href="projects.html"><span aria-hidden="true">⌂</span>All projects</a><a href="vendors.html"><span aria-hidden="true">◌</span>Vendors</a><a href="team.html"><span aria-hidden="true">☺</span>Users</a></nav>
      </aside>
      <main class="main-content">
        <header class="topbar"><div class="mobile-brand"><span class="brand-mark">F</span>frameflow<span class="brand-dot">.</span></div><div class="breadcrumb"><a href="projects.html">Projects</a><span aria-hidden="true">/</span><strong>Profile</strong></div><div class="top-context"><span class="sync-label"><i aria-hidden="true"></i> Live workspace</span></div><div class="top-actions"><button class="logout-btn" id="logoutBtn">Sign out</button></div></header>
        <div class="page-wrap registry-page">
          <section class="page-heading"><div><div class="heading-kicker"><span class="status-dot"></span> YOUR ACCOUNT</div><h1 id="profileName">—</h1><p id="profileMeta">—</p></div></section>
          <div class="registry-layout">
            <section class="registry-form-panel" aria-labelledby="passwordTitle"><div class="registry-panel-heading"><p class="stat-label">SECURITY</p><h2 id="passwordTitle">Change password</h2><p>Use at least 8 characters.</p></div><form id="passwordForm" class="vendor-form"><label for="currentPasswordInput">Current password<input id="currentPasswordInput" name="currentPassword" type="password" autocomplete="current-password" required /></label><label for="newPasswordInput">New password<input id="newPasswordInput" name="newPassword" type="password" autocomplete="new-password" minlength="8" required /></label><label for="confirmPasswordInput">Confirm new password<input id="confirmPasswordInput" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required /></label><button class="primary-btn" type="submit">Update password <span aria-hidden="true">→</span></button></form></section>
            <section class="registry-list-panel" aria-labelledby="accountDetailsTitle"><div class="registry-list-heading"><div><p class="stat-label">DETAILS</p><h2 id="accountDetailsTitle">Account details</h2></div></div><div class="vendor-list"><article class="vendor-row"><div class="vendor-badge" aria-hidden="true" id="profileInitials">—</div><div class="vendor-main"><strong id="profileEmail">—</strong><span id="profileRole">—</span></div></article></div></section>
          </div>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="profile.js"></script>
  </body>
</html>
</content>
